# Déploiement continu vers Plesk (staging ET production). Voir deploy/PLESK.md, section
# « Déploiement continu ».
#
# Déroulé : « Tests » vert sur master -> build (vendor sans dev + public/build) ->
# branche `staging` force-poussée -> appel des webhooks Plesk (secrets) -> Plesk tire
# `staging` et déploie (mode Automatic) -> on attend que chaque site serve le nouveau
# build, puis on lance ses migrations via POST /system/migrate (jeton X-Deploy-Token).
#
# Aucun secret dans ce fichier : les URL de webhook viennent des secrets GitHub
# PLESK_WEBHOOK_STAGING et PLESK_WEBHOOK_PRODUCTION, les jetons de migration des secrets
# DEPLOY_TOKEN_STAGING et DEPLOY_TOKEN_PRODUCTION (jamais affichés dans les logs). Les
# adresses des sites sont des variables (non secrètes) SITE_URL_STAGING et SITE_URL_PRODUCTION.

name: Deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # - jamais sur un fork ;
    # - workflow_run : uniquement un run « Tests » réussi, déclenché par un push sur master
    #   de CE dépôt (pas une pull request, même nommée master, venant d'un fork) ;
    # - workflow_dispatch : uniquement lancé depuis master.
    if: >-
      !github.event.repository.fork && (
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'master'
          && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
      )
    env:
      # Commit testé (workflow_run) ou pointe de master (lancement manuel).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout du commit testé
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Vérifier que le commit est toujours la pointe de master
        id: freshness
        if: github.event_name == 'workflow_run'
        run: |
          MASTER_SHA=$(git rev-parse origin/master)
          if [ "$MASTER_SHA" != "$DEPLOY_SHA" ]; then
            echo "::notice::master a avancé ($MASTER_SHA) depuis le commit testé ($DEPLOY_SHA) : déploiement ignoré, le run suivant déploiera."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.freshness.outputs.skip != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, gd
          coverage: none

      - name: Install PHP dependencies (production)
        if: steps.freshness.outputs.skip != 'true'
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts

      # --no-scripts saute package:discover : on génère bootstrap/cache/packages.php ici pour
      # le versionner (Laravel ne le régénère pas tout seul s'il existe déjà sur le serveur).
      - name: Package discovery
        if: steps.freshness.outputs.skip != 'true'
        run: php artisan package:discover --ansi

      - name: Setup Node
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        if: steps.freshness.outputs.skip != 'true'
        env:
          VITE_APP_NAME: Temple Shift Management
        run: npm run build

      - name: Construire et pousser la branche staging
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          test -f vendor/autoload.php
          test -f bootstrap/cache/packages.php

          SHORT_SHA=$(git rev-parse --short "$DEPLOY_SHA")

          # Garde-fou n°1 : aucun fichier sensible déjà suivi sur master ne doit partir
          # vers Plesk (le dépôt est public : on bloque aussi par précaution).
          if git ls-tree -r --name-only "$DEPLOY_SHA" \
              | grep -E '(^|/)\.env(\..*)?$|\.(sql|sqlite|pem|key|p12|pfx)$|(^|/)id_(rsa|ed25519)|^storage/' \
              | grep -Ev '(^|/)\.env\.(example|staging\.example)$|(^|/)\.gitignore$|(^|/)\.gitkeep$'; then
            echo "::error::Fichier sensible suivi sur master (voir ci-dessus) ; déploiement abandonné."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B staging "$DEPLOY_SHA"
          # Marqueur unique par exécution : permet d'attendre que Plesk ait bien déployé CE
          # build, même quand le front (donc manifest.json) n'a pas changé.
          echo "$DEPLOY_SHA $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" > public/build/deploy-id.txt
          git add -f public/build vendor bootstrap/cache/packages.php

          # Garde-fou n°2 : rien d'autre que les artefacts de build ne doit être indexé.
          if git diff --cached --name-only | grep -Ev '^(public/build/|vendor/|bootstrap/cache/packages\.php$)'; then
            echo "::error::Fichiers inattendus indexés (voir ci-dessus) ; abandon."
            exit 1
          fi

          git commit --quiet -m "Build pour staging ($SHORT_SHA)" \
            -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>"
          git push --force-with-lease origin staging
          echo "staging = $(git rev-parse --short HEAD) (master $SHORT_SHA)"

      - name: Appeler les webhooks Plesk
        if: steps.freshness.outputs.skip != 'true'
        env:
          PLESK_WEBHOOK_STAGING: ${{ secrets.PLESK_WEBHOOK_STAGING }}
          PLESK_WEBHOOK_PRODUCTION: ${{ secrets.PLESK_WEBHOOK_PRODUCTION }}
        run: |
          set -uo pipefail
          failed=0
          for name in PLESK_WEBHOOK_STAGING PLESK_WEBHOOK_PRODUCTION; do
            url="${!name}"
            if [ -z "$url" ]; then
              echo "::warning::Secret $name vide : site non notifié (déployer à la main dans Plesk)."
              continue
            fi
            # L'URL n'est jamais affichée : sortie du corps jetée, erreurs curl sans URL.
            if curl -fsS -m 60 -X POST -o /dev/null "$url"; then
              echo "Webhook $name appelé."
            else
              echo "::error::Échec de l'appel du webhook $name."
              failed=1
            fi
          done
          exit "$failed"

      # Plesk n'a ni SSH ni planificateur : c'est le pipeline qui lance les migrations, une
      # fois que le site sert le nouveau build (le premier déploiement avec vendor est lent).
      - name: Lancer les migrations sur chaque site
        if: steps.freshness.outputs.skip != 'true'
        env:
          SITE_URL_STAGING: ${{ vars.SITE_URL_STAGING }}
          SITE_URL_PRODUCTION: ${{ vars.SITE_URL_PRODUCTION }}
          DEPLOY_TOKEN_STAGING: ${{ secrets.DEPLOY_TOKEN_STAGING }}
          DEPLOY_TOKEN_PRODUCTION: ${{ secrets.DEPLOY_TOKEN_PRODUCTION }}
        run: |
          set +x
          set -uo pipefail
          expected_manifest=$(sha256sum public/build/manifest.json | cut -d' ' -f1)
          expected_id=$(cat public/build/deploy-id.txt)
          failed=0
          for site in STAGING PRODUCTION; do
            url_var="SITE_URL_$site"
            token_var="DEPLOY_TOKEN_$site"
            # Espaces/retours à la ligne collés par erreur dans la variable ou le secret : retirés.
            base="$(printf '%s' "${!url_var}" | tr -d '[:space:]')"
            base="${base%/}"
            token="$(printf '%s' "${!token_var}" | tr -d '[:space:]')"
            if [ -z "$base" ] || [ -z "$token" ]; then
              echo "::warning::Variable SITE_URL_$site ou secret DEPLOY_TOKEN_$site vide : migrations non lancées sur ce site (Laravel Toolkit > Artisan : migrate --force)."
              continue
            fi

            # 1) Attendre (6 min max) que le site serve ce build : marqueur ET manifeste.
            deadline=$((SECONDS + 360))
            ready=0
            while [ "$SECONDS" -lt "$deadline" ]; do
              served_id=$(curl -fsS -m 20 -H 'Cache-Control: no-cache' "$base/build/deploy-id.txt?r=$GITHUB_RUN_ID" 2>/dev/null || true)
              served_manifest=$( { curl -fsS -m 20 -H 'Cache-Control: no-cache' "$base/build/manifest.json?r=$GITHUB_RUN_ID" 2>/dev/null || true; } | sha256sum | cut -d' ' -f1)
              if [ "$served_id" = "$expected_id" ] && [ "$served_manifest" = "$expected_manifest" ]; then
                ready=1
                break
              fi
              sleep 10
            done
            if [ "$ready" != 1 ]; then
              echo "::error::$site : le site ne sert pas le nouveau build après 6 min (déploiement Plesk en échec ou trop lent) ; migrations non lancées."
              failed=1
              continue
            fi
            echo "$site : nouveau build en ligne."

            # 2) Migrations. Le jeton passe par l'entrée standard (ni argument ni log).
            body=$(mktemp)
            status=$(printf 'X-Deploy-Token: %s\n' "$token" \
              | curl -sS -m 120 -X POST -H @- -H 'Accept: application/json' \
                  -o "$body" -w '%{http_code}' "$base/system/migrate" || echo 000)
            if [ "$status" = 200 ]; then
              echo "$site : migrated=$(jq -r '.migrated' "$body")"
              jq -r '.output' "$body" | head -c 1500
              echo
            else
              echo "::error::$site : POST /system/migrate a répondu $status ($(jq -r '.message // empty' "$body" 2>/dev/null | head -c 200))."
              failed=1
            fi
            rm -f "$body"
          done
          exit "$failed"
