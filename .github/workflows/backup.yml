# DÉSACTIVÉ : la cible (route /system/backup de l'appli Railway) est abandonnée depuis la
# bascule vers Plesk. Plus de déclenchement nocturne ; lancement manuel seulement
# (workflow_dispatch), utile uniquement tant que Railway reste en ligne.
# Les sauvegardes de production passent désormais par Plesk (Backup Manager).
name: Database backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Download database dump
        run: |
          curl -sf -H "X-Backup-Token: ${{ secrets.BACKUP_TOKEN }}" \
            "${{ vars.BACKUP_URL }}" \
            -o "shiftmanagement-$(date +%Y-%m-%d).sql"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftmanagement-backup-${{ github.run_id }}
          path: shiftmanagement-*.sql
          retention-days: 30
